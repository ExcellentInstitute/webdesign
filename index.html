<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        // Universal Gatekeeper Script
        if (localStorage.getItem('excellent_auth') !== 'true') {
            document.addEventListener("DOMContentLoaded", function() {
                document.body.style.visibility = "hidden"; 
                document.body.style.overflow = "hidden";
                
                const lockDiv = document.createElement('div');
                lockDiv.style.cssText = "position:fixed; top:0; left:0; width:100vw; height:100vh; background:#0f172a; z-index:9999999; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; font-family:'Inter', sans-serif; visibility:visible;";
                
                lockDiv.innerHTML = `
                    <div style="background:#1e293b; padding:40px; border-radius:12px; text-align:center; box-shadow:0 25px 50px -12px rgba(0,0,0,0.5); border: 1px solid #334155; max-width:90%; width:400px;">
                        <h2 style="margin-bottom:10px; color:#10b981; font-size:1.8rem;">Restricted Access 🛡️</h2>
                        <p style="color:#94a3b8; margin-bottom:25px; line-height:1.5;">This portal is strictly for registered students of Excellent Institute.</p>
                        
                        <input type="email" id="authEmail" placeholder="Enter Authorized Email" style="width:100%; padding:14px; margin-bottom:20px; border-radius:8px; border:2px solid #334155; background:#0f172a; color:white; text-align:center; outline:none; font-size:1.1rem; transition: border-color 0.2s;">
                        
                        <button onclick="verifyAccess()" style="width:100%; padding:14px; background:#10b981; color:white; border:none; border-radius:8px; font-size:1.1rem; font-weight:bold; cursor:pointer; transition: background 0.2s;">
                            Verify Connection
                        </button>
                        
                        <div id="authError" style="display:none; background-color: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; padding: 15px; border-radius: 8px; color:#fca5a5; margin-top:20px; font-weight:600; line-height:1.5;">
                            ❌ Access Denied.<br><br>Please use the Excellent Institute mobile APK to view this content.
                        </div>
                    </div>
                `;
                document.documentElement.appendChild(lockDiv);

                window.verifyAccess = function() {
                    const emailInput = document.getElementById('authEmail').value.toLowerCase().trim();
                    const inputBox = document.getElementById('authEmail');
                    
                    if (emailInput === 'excellent.institut@gmail.com') { 
                        localStorage.setItem('excellent_auth', 'true');
                        lockDiv.remove();
                        document.body.style.visibility = "visible";
                        document.body.style.overflow = "auto";
                    } else {
                        document.getElementById('authError').style.display = "block";
                        inputBox.style.borderColor = "#ef4444";
                    }
                };
            });
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excellent Institute - Web Designing (PGDCA)</title>
    <!-- Modern Font Integration -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Web Developer Cyber Theme */
            --primary: #4f46e5; 
            --primary-light: #e0e7ff;
            --accent: #6366f1;
            --surface: #ffffff;
            --background: #f8fafc; 
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
            --radius: 12px;
            
            /* Code Editor Colors */
            --code-bg: #1e1e1e;
            --code-border: #333333;
            --tab-bg: #2d2d2d;
            --tab-active: #1e1e1e;
            --tab-text: #858585;
            --tab-text-active: #ffffff;
        }
        
        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            background-color: var(--background);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            letter-spacing: -0.01em;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #a5b4fc; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #818cf8; }

        /* --- Header --- */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 24px; background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
            z-index: 10; box-shadow: var(--shadow-sm);
        }

        .brand { display: flex; align-items: center; gap: 15px; }

        .toggle-btn {
            background: none; border: none; color: var(--primary); cursor: pointer;
            padding: 6px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; transition: background 0.2s ease;
        }
        .toggle-btn:hover { background-color: var(--primary-light); }

        .brand img.logo {
            width: 45px; height: 45px; border-radius: 50%; object-fit: cover;
            border: 2px solid var(--accent); box-shadow: var(--shadow-sm); cursor: pointer;
        }
        .brand h2 { margin: 0; color: var(--primary); font-size: 1.3rem; font-weight: 700; cursor: pointer; }

        /* --- Main Layout & Sidebar --- */
        .main-container { display: flex; flex: 1; overflow: hidden; }

        .sidebar {
            width: 320px; background-color: var(--surface); border-right: 1px solid var(--border);
            padding: 24px 16px; overflow-y: auto; overflow-x: hidden; flex-shrink: 0;
            display: flex; flex-direction: column; gap: 6px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); opacity: 1;
        }
        
        .sidebar.collapsed { width: 0; padding: 24px 0; border-right: none; opacity: 0; }
        
        .nav-label {
            font-size: 0.75rem; text-transform: uppercase; font-weight: 700;
            color: var(--text-muted); margin-bottom: 10px; padding-left: 12px;
            white-space: nowrap;
        }

        .nav-btn {
            display: flex; align-items: center; width: 100%; padding: 12px 16px;
            border: none; background: none; text-align: left; font-size: 0.95rem;
            font-weight: 600; color: var(--text-muted); cursor: pointer;
            border-radius: var(--radius); transition: all 0.2s ease;
            white-space: normal; line-height: 1.4;
        }
        .nav-btn:hover { background-color: var(--background); color: var(--text-main); }
        .nav-btn.active { background-color: var(--primary-light); color: var(--primary); }

        /* --- Content Area --- */
        .content-area {
            flex: 1; padding: 40px 60px; overflow-y: auto;
            background-color: transparent; cursor: grab; scroll-behavior: smooth;
        }
        .content-area:active { cursor: grabbing; } 

        .content-wrapper {
            max-width: 1100px; margin: 0 auto; position: relative; 
            z-index: 2; transition: max-width 0.3s ease; animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .allow-select { pointer-events: auto; }

        /* --- Topic Cards --- */
        .chapter-header {
            background: var(--surface); padding: 30px 40px; border-radius: 16px;
            box-shadow: var(--shadow-sm); border: 1px solid var(--border);
            margin-bottom: 40px; border-left: 6px solid var(--primary);
        }
        .chapter-header h1 { color: var(--text-main); font-size: 2.2rem; font-weight: 800; margin: 0; }

        .topic-card {
            background: var(--surface); padding: 35px 40px; border-radius: 16px;
            box-shadow: var(--shadow-sm); border: 1px solid var(--border);
            margin-bottom: 35px; transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .topic-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--primary-light); }
        .topic-card h3 { color: var(--primary); font-size: 1.5rem; margin: 0 0 20px 0; border-bottom: 2px solid var(--background); padding-bottom: 12px; }
        
        .topic-text { line-height: 1.8; font-size: 1.15rem; color: #334155; margin-bottom: 20px; }
        .topic-text p { margin-top: 0; margin-bottom: 15px; }
        .topic-text ul { padding-left: 20px; margin-bottom: 15px; }
        .topic-text li { margin-bottom: 8px; }

        /* Shortcuts */
        .shortcut-box {
            background-color: #eef2ff; border-left: 4px solid var(--accent);
            padding: 16px 20px; margin: 20px 0; border-radius: 0 8px 8px 0;
            display: flex; align-items: center; gap: 12px; font-size: 1.05rem; color: var(--primary); line-height: 1.6;
        }

        /* --- LIVE CODE PLAYGROUND UI --- */
        .code-playground {
            background: var(--code-bg);
            border-radius: 12px;
            border: 1px solid var(--code-border);
            overflow: hidden;
            margin: 25px 0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            font-family: 'Inter', sans-serif;
        }

        .playground-tabs {
            display: flex;
            background: var(--tab-bg);
            border-bottom: 1px solid var(--code-border);
        }

        .playground-tab {
            padding: 12px 24px;
            background: transparent;
            border: none;
            color: var(--tab-text);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            border-top: 2px solid transparent;
        }

        .playground-tab:hover {
            color: var(--tab-text-active);
            background: rgba(255,255,255,0.05);
        }

        .playground-tab.active {
            background: var(--code-bg);
            color: var(--tab-text-active);
            border-top: 2px solid #38bdf8;
        }

        /* Special style for the Preview tab */
        .playground-tab.preview-tab {
            margin-left: auto;
            color: #10b981;
            border-left: 1px solid var(--code-border);
        }
        .playground-tab.preview-tab.active {
            border-top: 2px solid #10b981;
        }

        .playground-panels {
            position: relative;
            min-height: 250px;
            max-height: 400px;
        }

        .code-panel {
            display: none;
            padding: 20px;
            margin: 0;
            overflow-y: auto;
            color: #d4d4d4;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 1.05rem;
            line-height: 1.6;
            height: 100%;
            white-space: pre-wrap;
        }

        .code-panel.active {
            display: block;
        }

        .preview-iframe {
            display: none;
            width: 100%;
            height: 350px;
            border: none;
            background: #ffffff; /* Previews need a white canvas normally */
        }
        .preview-iframe.active {
            display: block;
        }

        /* --- Dashboard Grid (Home View) --- */
        .hero { text-align: center; margin-bottom: 50px; background: var(--surface); padding: 50px; border-radius: 16px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
        .hero h1 { font-size: 2.5rem; color: var(--text-main); margin: 0 0 15px 0; }
        .hero p { color: var(--text-muted); font-size: 1.15rem; margin: 0; }
        
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; pointer-events: auto; }
        .module-card {
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 30px; cursor: pointer; transition: all 0.3s ease; box-shadow: var(--shadow-sm);
            display: flex; flex-direction: column; align-items: flex-start;
        }
        .module-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg); border-color: var(--accent); }
        .card-icon { font-size: 2.2rem; margin-bottom: 20px; background: var(--primary-light); width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; border-radius: 12px; }
        .module-card h3 { margin: 0 0 10px 0; color: var(--text-main); font-size: 1.25rem; line-height: 1.4; }
        .module-card span { font-size: 0.9rem; color: var(--text-muted); font-weight: 600; }

        .watermark-bg { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 45vw; max-width: 400px; opacity: 0.03; pointer-events: none; z-index: 1; border-radius: 50%; object-fit: cover; }

        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border); flex-direction: row; overflow-x: auto; padding: 12px; gap: 10px;}
            .sidebar.collapsed { height: 0; padding: 0; border: none; opacity: 0; }
            .nav-label { display: none; }
            .nav-btn { white-space: nowrap; padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); }
            .content-area { padding: 20px 15px; }
            .content-wrapper { padding: 0; }
            .topic-card { padding: 20px; margin-bottom: 20px; }
            .chapter-header { padding: 20px; }
            .watermark-bg { width: 70vw; }
            .playground-tab { padding: 10px 15px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="brand">
            <button id="sidebar-toggle" class="toggle-btn" onclick="toggleSidebar()" title="Hide/Show Menu">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
            <img src="logo.png" alt="Excellent Institute Logo" class="logo" id="mainLogo" onclick="loadDashboard()">
            <h2 onclick="loadDashboard()">Excellent Institute</h2>
        </div>
        <div class="action-btns">
            <button onclick="window.print()">🖨️ Print / PDF</button>
        </div>
    </div>

    <img src="logo.png" alt="Watermark" class="watermark-bg" id="watermarkLogo">

    <div class="main-container">
        
        <!-- Sidebar -->
        <div class="sidebar" id="main-sidebar">
            <div class="nav-label">Course Modules</div>
            <button class="nav-btn active" onclick="loadDashboard()" id="home-btn">🏠 Dashboard</button>
            <div id="nav-container" style="display: flex; flex-direction: column; gap: 6px;">
                <!-- JavaScript will inject chapter buttons here -->
            </div>
        </div>

        <!-- Content Display Area -->
        <div class="content-area" id="content-display">
            <!-- JavaScript will inject theory and live code here -->
        </div>
    </div>

    <!-- Link to Content Data -->
    <script src="pgdca-web-data.js"></script>
    
    <!-- Application Logic -->
    <script>
        const navContainer = document.getElementById('nav-container');
        const contentDisplay = document.getElementById('content-display');
        const sidebar = document.getElementById('main-sidebar');
        
        // PGDCA Exclusive Lock
        let isPgdcaUnlocked = false; 

        // 1. Initialize Application
        function initApp() {
            if (typeof webBookData === 'undefined' || webBookData.length === 0) {
                contentDisplay.innerHTML = `<h2 style="color:red; text-align:center; padding:50px;">Awaiting pgdca-web-data.js File...</h2>`;
                return;
            }
            
            webBookData.forEach((chapter, index) => {
                const btn = document.createElement('button');
                btn.className = 'nav-btn note-nav-btn';
                
                // Everything is strictly locked initially
                let displayIcon = isPgdcaUnlocked ? '💻' : '🔒';
                
                btn.innerHTML = `${displayIcon} ${chapter.title.split(':')[0]}`; 
                btn.onclick = () => loadContent(index, btn);
                navContainer.appendChild(btn);
            });
            
            loadEntryScreen();
        }

        // 2. Sidebar Toggle Logic
        function toggleSidebar() {
            sidebar.classList.toggle('collapsed');
        }

        // 3. Load Entry Screen
        function loadEntryScreen() {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

            let html = `
            <div class="content-wrapper allow-select" style="text-align: center; margin-top: 5vh; background: var(--surface); padding: 50px; border-radius: 16px; border: 1px solid var(--border); box-shadow: var(--shadow-md);">
                <h1 style="font-size: 2.8rem; color: var(--primary); margin-bottom: 10px;">Web Design Masterclass</h1>
                <p style="font-size: 1.2rem; color: var(--text-muted); margin-bottom: 30px;">PGDCA Exclusive: HTML, CSS, and Interactive JavaScript.</p>
                
                <div style="background:#1e1e1e; padding:30px; border-radius:12px; max-width:600px; margin:0 auto 40px auto; color:#d4d4d4; font-family:monospace; text-align:left; box-shadow:0 10px 25px rgba(0,0,0,0.2);">
                    <span style="color:#569cd6;">function</span> <span style="color:#dcdcaa;">startLearning</span>() {<br>
                    &nbsp;&nbsp;<span style="color:#c586c0;">if</span> (student === <span style="color:#ce9178;">"Ready"</span>) {<br>
                    &nbsp;&nbsp;&nbsp;&nbsp;console.<span style="color:#dcdcaa;">log</span>(<span style="color:#ce9178;">"Welcome to the Matrix!"</span>);<br>
                    &nbsp;&nbsp;}<br>
                    }
                </div>
                
                <button onclick="loadDashboard()" style="background-color: var(--primary); color: white; border: none; padding: 15px 40px; font-size: 1.2rem; border-radius: 8px; cursor: pointer; font-weight: bold; box-shadow: var(--shadow-md);">
                    Start Coding 🚀
                </button>
            </div>`;
            
            contentDisplay.innerHTML = html;
            contentDisplay.scrollTop = 0;
        }

        // 4. Load Dashboard (Home Grid)
        function loadDashboard() {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('home-btn').classList.add('active');

            let html = `
            <div class="content-wrapper allow-select">
                <div class="hero">
                    <h1>Interactive Web Design (PGDCA)</h1>
                    <p>Learn to code with live, interactive HTML, CSS, and JS playgrounds.</p>
                </div>
                <div class="dashboard-grid">`;
            
            if (typeof webBookData !== 'undefined') {
                webBookData.forEach((chapter, index) => {
                    let isLocked = !isPgdcaUnlocked;
                    let icon = isLocked ? '🔒' : '💻';
                    let lockedText = isLocked ? '<span style="color:#ef4444; font-size:0.9rem;"> (Locked)</span>' : '';
                    
                    html += `
                        <div class="module-card" onclick="document.querySelectorAll('.note-nav-btn')[${index}].click()">
                            <div class="card-icon">${icon}</div>
                            <h3>${chapter.title}${lockedText}</h3>
                            <span>${chapter.topics.length} Interactive Topics</span>
                        </div>`;
                });
            }

            html += `</div></div>`;
            contentDisplay.innerHTML = html;
            contentDisplay.scrollTop = 0;
        }

        // Helper Function to escape HTML tags so they display as code
        function escapeHtml(unsafe) {
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        // 5. Load Specific Chapter Content
        function loadContent(index, clickedBtn) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if(clickedBtn) clickedBtn.classList.add('active');

            // --- STRICT PGDCA LOCK ---
            if (!isPgdcaUnlocked) {
                let lockHtml = `
                <div class="content-wrapper allow-select" style="text-align: center; padding: 80px 20px; background: var(--surface); border-radius: 16px; border: 1px solid var(--border); box-shadow: var(--shadow-md);">
                    <div style="font-size: 5rem; margin-bottom: 10px;">🔒</div>
                    <h2 style="color: var(--primary); font-size: 2rem;">Course Modules Locked</h2>
                    <p style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 25px;">This interactive coding masterclass is restricted to PGDCA students. Please enter the PGDCA password.</p>
                    
                    <input type="password" id="pgdcaPass" placeholder="Password" style="padding: 12px; font-size: 1.2rem; border: 2px solid var(--primary); border-radius: 8px; width: 100%; max-width: 250px; text-align: center; outline: none;">
                    <br><br>
                    
                    <button onclick="checkPgdcaPassword(${index})" style="background-color: var(--primary); color: white; border: none; padding: 12px 40px; font-size: 1.1rem; border-radius: 8px; cursor: pointer; font-weight: bold; box-shadow: var(--shadow-md);">
                        Unlock 🔓
                    </button>
                    
                    <p id="wrong-pass-msg" style="color: #ef4444; font-weight: bold; margin-top: 15px; display: none;">❌ Access Denied! Incorrect Password.</p>
                </div>`;
                
                contentDisplay.innerHTML = lockHtml;
                contentDisplay.scrollTop = 0;
                if(window.innerWidth <= 768) sidebar.classList.add('collapsed');
                return; 
            }

            const chapter = webBookData[index];
            
            let htmlContent = `
            <div class="content-wrapper">
                <div class="note-section allow-select">
                    <div class="chapter-header">
                        <h1>${chapter.title}</h1>
                    </div>`;
            
            chapter.topics.forEach((topic, tIndex) => {
                let uniqueId = `ch${index}-t${tIndex}`; // Unique ID for each code playground

                htmlContent += `
                <div class="topic-card">
                    <h3>${topic.heading}</h3>
                    <div class="topic-text">${topic.text}</div>`;
                
                // --- INJECT INTERACTIVE CODE PLAYGROUND ---
                if(topic.interactiveCode) {
                    
                    // Build the safe source document for the iframe
                    // We inject the CSS in style tags, the HTML in body, and JS in script tags
                    const iframeContent = `
                        <html>
                        <head>
                            <style>
                                body { font-family: sans-serif; padding: 10px; margin: 0; }
                                ${topic.interactiveCode.css}

/* --- Print & PDF Export Styling --- */
        @media print {
            body, .main-container { height: auto; overflow: visible; display: block; background-color: transparent !important; }
            .sidebar, .header, .action-btns, .dashboard-grid, .hero { display: none !important; }
            .content-area { padding: 0; cursor: auto; background-color: transparent !important; }
            .content-wrapper { margin: 0; padding: 0; box-shadow: none; border: none; max-width: 100%; background: transparent !important; }
            
            /* Strip the UI cards back to clean textbook format */
            .topic-card { box-shadow: none !important; border: none !important; padding: 0 !important; margin-bottom: 40px !important; background: transparent !important; page-break-inside: avoid; }
            .chapter-header { box-shadow: none !important; border: none !important; padding: 0 !important; margin-bottom: 20px !important; background: transparent !important; border-left: none !important; page-break-before: always;}
            .note-section { pointer-events: auto; }
            .watermark-bg { display: block; opacity: 0.08; width: 60vw; max-width: 600px; }
            
            /* Clean Text Typography */
            h1 { color: #000 !important; padding: 0; margin-bottom: 10px; }
            h1:first-of-type { page-break-before: auto; }
            h3 { color: #000 !important; border-bottom: 1px solid #ccc; padding-bottom: 5px; margin-bottom: 10px; }
            p, .topic-text { color: #000 !important; }
            img { page-break-inside: avoid; border: none; max-width: 100%; }
            .shortcut-box { border: 1px solid #000 !important; background: transparent !important; color: #000 !important; }
            kbd { border: 1px solid #000 !important; box-shadow: none !important; background: transparent !important; color: #000 !important; }

            /* --- MAGIC SEQUENTIAL CODE PRINTING --- */
            .playground-tabs { display: none !important; } /* Hide the dark UI tabs */
            .code-playground { border: none !important; box-shadow: none !important; background: transparent !important; margin: 20px 0 !important; }
            
            /* Force HTML, CSS, JS panels to stack and print cleanly */
            .code-panel { 
                display: block !important; 
                background: #ffffff !important; 
                color: #000000 !important; 
                border: 1px dashed #64748b !important; 
                padding: 15px !important; 
                margin-bottom: 15px !important; 
                height: auto !important; 
                max-height: none !important; 
                white-space: pre-wrap !important;
                page-break-inside: avoid;
            }
            
            /* Strip out all neon syntax highlighting colors for the printer */
            .code-panel code, .code-panel span { color: #000000 !important; font-weight: normal !important; }
            
            /* Inject automatic titles above the printed code boxes */
            .code-panel[id^="html-panel"]::before { content: "📄 HTML Code:"; display: block; font-weight: bold; margin-bottom: 10px; color: #000; border-bottom: 1px solid #000; padding-bottom: 5px;}
            .code-panel[id^="css-panel"]::before { content: "🎨 CSS Code:"; display: block; font-weight: bold; margin-bottom: 10px; color: #000; border-bottom: 1px solid #000; padding-bottom: 5px;}
            .code-panel[id^="js-panel"]::before { content: "⚡ JavaScript Code:"; display: block; font-weight: bold; margin-bottom: 10px; color: #000; border-bottom: 1px solid #000; padding-bottom: 5px;}
            
            /* Print the live preview frame at the very bottom of the stack */
            .preview-iframe { 
                display: block !important; 
                height: 300px !important; 
                border: 2px solid #000 !important; 
                margin-bottom: 20px !important; 
                page-break-inside: avoid;
            }
        }
                                
                            </style>
                        </head>
                        <body>
                            ${topic.interactiveCode.html}
                            <script>
                                ${topic.interactiveCode.js}
                            <\/script>
                        </body>
                        </html>
                    `;
                    // Escape it for the srcdoc attribute
                    const safeIframeSrc = iframeContent.replace(/"/g, '&quot;');

                    htmlContent += `
                    <div class="code-playground" id="playground-${uniqueId}">
                        <div class="playground-tabs">
                            <button class="playground-tab active" onclick="switchTab('${uniqueId}', 'html')">HTML</button>
                            <button class="playground-tab" onclick="switchTab('${uniqueId}', 'css')">CSS</button>
                            <button class="playground-tab" onclick="switchTab('${uniqueId}', 'js')">JS</button>
                            <button class="playground-tab preview-tab" onclick="switchTab('${uniqueId}', 'preview')">▶ Live Preview</button>
                        </div>
                        <div class="playground-panels">
                            <pre class="code-panel active" id="html-panel-${uniqueId}"><code style="color:#569cd6;">${escapeHtml(topic.interactiveCode.html) || "// No HTML provided"}</code></pre>
                            
                            <pre class="code-panel" id="css-panel-${uniqueId}"><code style="color:#d7ba7d;">${escapeHtml(topic.interactiveCode.css) || "/* No CSS provided */"}</code></pre>
                            
                            <pre class="code-panel" id="js-panel-${uniqueId}"><code style="color:#c586c0;">${escapeHtml(topic.interactiveCode.js) || "// No JavaScript provided"}</code></pre>
                            
                            <!-- The Live Magic Happens Here -->
                            <iframe class="preview-iframe" id="preview-panel-${uniqueId}" srcdoc="${safeIframeSrc}"></iframe>
                        </div>
                    </div>`;
                }

                if(topic.shortcut) {
                    htmlContent += `
                    <div class="shortcut-box">
                        <strong>💡 Pro-Tip:</strong> <span>${topic.shortcut}</span>
                    </div>`;
                }

                htmlContent += `</div>`; // Close topic-card
            });
            
            htmlContent += `</div></div>`; // Close note-section & content-wrapper
            
            contentDisplay.innerHTML = htmlContent;
            contentDisplay.scrollTop = 0;
            
            if(window.innerWidth <= 768) {
                sidebar.classList.add('collapsed');
            }
        }

        // --- CODE PLAYGROUND SWITCHING LOGIC ---
        window.switchTab = function(uniqueId, targetTab) {
            const playground = document.getElementById(`playground-${uniqueId}`);
            
            // 1. Deactivate all tabs and panels in THIS specific playground
            const tabs = playground.querySelectorAll('.playground-tab');
            const panels = playground.querySelectorAll('.code-panel, .preview-iframe');
            
            tabs.forEach(t => t.classList.remove('active'));
            panels.forEach(p => p.classList.remove('active'));
            
            // 2. Activate the clicked tab
            // Determine which tab button was clicked based on its text or class
            if(targetTab === 'html') tabs[0].classList.add('active');
            if(targetTab === 'css') tabs[1].classList.add('active');
            if(targetTab === 'js') tabs[2].classList.add('active');
            if(targetTab === 'preview') tabs[3].classList.add('active');

            // 3. Activate the target panel
            document.getElementById(`${targetTab}-panel-${uniqueId}`).classList.add('active');
        };

        // 6. Verify PGDCA Password
        function checkPgdcaPassword(index) {
            const input = document.getElementById('pgdcaPass').value.trim().toUpperCase(); 
            
            if (input === "PGDCA") {
                isPgdcaUnlocked = true;
                
                // Instantly turn all 🔒 into 💻
                document.querySelectorAll('.note-nav-btn').forEach((btn) => {
                    btn.innerHTML = btn.innerHTML.replace('🔒', '💻');
                });
                
                const btn = document.querySelectorAll('.note-nav-btn')[index];
                loadContent(index, btn); 
            } else {
                document.getElementById('wrong-pass-msg').style.display = 'block';
            }
        }

        // Drag-to-Scroll Logic
        let isDown = false, startY, scrollTop;

        contentDisplay.addEventListener('mousedown', (e) => {
            // Do not drag if interacting with the code playground or cards
            if(e.target.closest('.module-card') || e.target.closest('.code-playground') || e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
            isDown = true;
            startY = e.pageY - contentDisplay.offsetTop;
            scrollTop = contentDisplay.scrollTop;
            let noteSec = contentDisplay.querySelector('.note-section');
            if(noteSec) noteSec.classList.remove('allow-select');
        });

        contentDisplay.addEventListener('mouseleave', () => {
            isDown = false;
            let noteSec = contentDisplay.querySelector('.note-section');
            if(noteSec) noteSec.classList.add('allow-select');
        });

        contentDisplay.addEventListener('mouseup', () => {
            isDown = false;
            let noteSec = contentDisplay.querySelector('.note-section');
            if(noteSec) noteSec.classList.add('allow-select');
        });

        contentDisplay.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const y = e.pageY - contentDisplay.offsetTop;
            const walk = (y - startY) * 2; 
            contentDisplay.scrollTop = scrollTop - walk;
        });

        // Run application on load
        window.onload = initApp;
    </script>
</body>
</html>
